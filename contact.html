<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Sydney Ewing</title>
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        /* Custom Navbar Styling */
        .custom-navbar {
            background-color: #8f767c !important;
        }
        .custom-navbar .navbar-nav .nav-link {
            color: white !important;
        }
        .custom-navbar .navbar-nav .nav-link:hover {
            color: #f0e6e6 !important;
        }
        .custom-navbar .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        /* Contact Section Styling */
        .contact-box {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f9f9f9;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }

        /* Form Styling */
        .contact-form input, .contact-form textarea {
            border-radius: 5px;
            border: 1px solid #ccc;
            padding: 10px;
            width: 100%;
            transition: 0.3s ease-in-out;
        }

        .contact-form input:focus, .contact-form textarea:focus {
            border-color: #8f767c;
            box-shadow: 0px 0px 5px rgba(143, 118, 124, 0.5);
            outline: none;
        }

        .contact-form button {
            background-color: #8f767c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            transition: 0.3s ease-in-out;
        }

        .contact-form button:hover {
            background-color: #7a6066;
        }

        /* Contact Info Styling */
        .contact-info {
            text-align: center;
            margin-top: 20px;
        }

        .contact-info a {
            color: #8f767c;
            text-decoration: none;
            font-weight: bold;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="text-white text-center py-4" style="background-color: #8f767c;">
        <h1>Contact Me</h1>
        <p>Get in touch with me for inquiries, collaborations, or just to say hi!</p>
    </header>

                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="skills.html">Skills</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Form Section -->
    <div class="container my-5">
        <div class="row">
            <div class="col-lg-6 mx-auto">
                

                <!-- Contact Info -->
                <div class="contact-info mt-4">
                    <p><strong>Email:</strong> <a href="mailto:sydneyewing1@gmail.com">sydneyewing1@gmail.com</a></p>
                    <p><strong>Phone:</strong> <a href="tel:+18015804094">+1 (801) 580-4094</a></p>
                    <p><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/sydneewing/" target="_blank">linkedin.com/in/sydneewing/</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
